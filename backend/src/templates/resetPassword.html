<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; background: #f4f4f5; padding: 24px;">
    <div style="max-width: 480px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 32px;">
      <h2 style="color: #111827;">Reset your password</h2>
      <p style="color: #374151;">Hi {{name}},</p>
      <p style="color: #374151;">We received a request to reset your password. This link expires in 15 minutes.</p>
      <a href="{{resetUrl}}" style="display: inline-block; margin-top: 16px; padding: 12px 24px; background: #111827; color: #fff; text-decoration: none; border-radius: 6px;">Reset Password</a>
      <p style="color: #9ca3af; font-size: 12px; margin-top: 24px;">If you didn't request this, you can safely ignore this email — your password will not be changed.</p>
    </div>
  </body>
</html>
