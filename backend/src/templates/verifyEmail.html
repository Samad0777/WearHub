<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; background: #f4f4f5; padding: 24px;">
    <div style="max-width: 480px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 32px;">
      <h2 style="color: #111827;">Verify your email</h2>
      <p style="color: #374151;">Hi {{name}},</p>
      <p style="color: #374151;">Thanks for signing up. Please verify your email address by clicking the button below. This link expires in 24 hours.</p>
      <a href="{{verifyUrl}}" style="display: inline-block; margin-top: 16px; padding: 12px 24px; background: #111827; color: #fff; text-decoration: none; border-radius: 6px;">Verify Email</a>
      <p style="color: #9ca3af; font-size: 12px; margin-top: 24px;">If you didn't create this account, you can safely ignore this email.</p>
    </div>
  </body>
</html>
